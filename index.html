<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sixel-Web — Sixel 图片转换工具</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sixel-Web</h1>
            <a href="https://github.com/hyfaust/sixel-web" target="_blank" rel="noopener" class="github-corner" aria-label="GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.02 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.82.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
            </a>
        </div>
        <p class="subtitle">Sixel 图片格式在线转换工具</p>

        <div class="tabs">
            <button class="tab active" data-tab="convert">图片 → Sixel</button>
            <button class="tab" data-tab="decode">Sixel → 图片</button>
        </div>

        <!-- Tab 1: 图片 → Sixel -->
        <div id="tab-convert" class="tab-content active">
            <div class="card">
                <div class="card-title">参数配置</div>
                <div class="config-grid">
                    <div class="form-group">
                        <label>质量模式</label>
                        <select id="opt-quality">
                            <option value="auto">auto</option>
                            <option value="low">low（快速）</option>
                            <option value="high">high（256色+抖动+高清）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>抖动算法 (dithering)</label>
                        <select id="opt-dither">
                            <option value="none">无</option>
                            <option value="bayer">Bayer</option>
                            <option value="fs" selected>Floyd-Steinberg</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>编码策略</label>
                        <select id="opt-encode">
                            <option value="auto">auto（平衡）</option>
                            <option value="fast">fast（跳过 RLE）</option>
                            <option value="size">size（更小体积）</option>
                        </select>
                    </div>
                    <div class="form-group span-all">
                        <label>调色板颜色数: <span id="opt-colors-value">256</span></label>
                        <input type="range" id="opt-colors" min="2" max="256" value="256">
                    </div>
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="opt-keep-res" checked>
                            <label for="opt-keep-res">保持原始分辨率</label>
                        </div>
                        <label id="max-width-label" style="opacity:0.4;margin-top:6px">最大列宽（字符）</label>
                        <input type="number" id="opt-max-width" value="80" min="10" max="400" disabled>
                    </div>
                    <div class="form-group">
                        <label class="group-label">兼容性设置</label>
                        <div class="compat-opts">
                            <div class="checkbox-group">
                                <input type="checkbox" id="opt-8bit">
                                <label for="opt-8bit">8bit DCS</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="opt-gri-limit">
                                <label for="opt-gri-limit">GRI ≤255</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">上传图片</div>
                <input type="file" id="convert-files" multiple
                       accept="image/png,image/jpeg,image/gif,image/bmp,image/webp">
                <br><br>
                <button id="convert-btn" class="btn btn-primary">转换为 Sixel</button>
                <div class="status" id="convert-status"></div>
                <progress id="convert-progress" value="0" max="100" style="display:none"></progress>
            </div>

            <div id="convert-results"></div>
        </div>

        <!-- Tab 2: Sixel → 图片 -->
        <div id="tab-decode" class="tab-content">
            <div class="card">
                <div class="card-title">上传 .six 文件</div>
                <div id="decode-dropzone" class="dropzone">
                    <label for="decode-file" class="dropzone-label">点击选择或拖放 .six 文件到此处</label>
                    <input type="file" id="decode-file" accept=".six,.sixel,.txt" class="visually-hidden">
                </div>
            </div>

            <div class="card" id="decode-preview-card" style="display:none">
                <div class="card-title">预览</div>
                <div class="status" id="decode-info"></div>
                <div class="preview-wrapper">
                    <canvas id="decode-canvas"></canvas>
                </div>
                <div id="decode-export" class="export-bar" style="display:none">
                    <button id="export-png" class="btn btn-primary">导出 PNG</button>
                    <button id="export-jpeg" class="btn">导出 JPEG</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <a href="https://github.com/hyfaust/pysixel">sixel-web</a> — Sixel 图片终端显示器 &amp; Web 工具
            | 基于 Sixel 协议 (DEC VT)
        </div>
    </div>

    <script src="js/sixel-encoder.js?v=6"></script>
    <script src="js/quantize.js?v=14"></script>
    <script src="js/sixel-decoder.js?v=9"></script>
    <script src="js/app.js?v=16"></script>
</body>
</html>
